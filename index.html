<!DOCTYPE html>
<html>
<head>
    <title>My DevOps App</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #f0f0f0; }
        h1 { color: #0066cc; }
    </style>
</head>
<body>
    <h1>🚀 Hello DevOps World 2026!</h1>

        document.getElementById('time').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
